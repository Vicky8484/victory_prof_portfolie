<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VictorY</title>

    <!-- CSS filer -->
    <link rel="stylesheet" href="css/site.css" />

    <!-- JS filer -->
    <script src="js/tema.js" defer></script>
    <script src="js/mobile-menu.js" defer></script>
    <script src="js/hobby.js" defer></script>

    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon2.png" />
  </head>
  <body
    class="font-code bg-body-bg h-screen cursor-pointer transition-[background-color] duration-1000"
    data-theme="light"
  >
    <header
      class="text-text-color bg-header-bg flex h-16 items-center justify-between px-4 py-4 transition-[background-color] duration-1000 max-[800px]:relative max-[800px]:z-2"
    >
      <a href="index.html"
        ><h4
          class="group text-header-text text-lg font-normal transition-[font-size] duration-400 hover:text-xl"
        >
          <span
            class="text-accent group-hover:text-accent-hover font-black transition-colors duration-400"
            >V</span
          >ictorY
        </h4></a
      >

      <nav id="mainNavigation">
        <ul
          class="flex list-none justify-between gap-12 max-[800px]:flex-col max-[800px]:items-start max-[800px]:gap-6"
        >
          <li><a href="index.html">Forside</a></li>
          <li><a href="studie.html">Studie</a></li>
          <!-- <li><a>1. semester</a></li>
            <li><a>2. semester</a></li>
            <li><a>3. semester</a></li> -->
          <li>
            <a
              href="hobby.html"
              class="text-accent-hover hover:text-accent-hover"
              >Hobby</a
            >
          </li>
          <li><a href="kunder.html">Kunder</a></li>
          <li><a href="ommig.html">Om mig</a></li>
        </ul>
      </nav>

      <div class="flex gap-4">
        <button
          id="mobileMenuBtn"
          class="bg-header-bg text-header-text hover:text-accent z-3 hidden w-auto border-0 p-2 text-[1.4rem] leading-none max-[800px]:block"
          aria-label="Open navigation menu"
          aria-expanded="false"
        >
          ☰
        </button>
        <button id="changeBtn">Dark mode</button>
      </div>
    </header>
    <main
      class="bg-main-bg text-text-color mx-auto w-4/5 transition-[background-color] duration-1000 max-[800px]:block max-[800px]:w-full"
    >
      <div class="py-4 text-center">
        <p>
          Ikke alle de sider jeg har lavet<br /><br />
          - bare dem som jeg kan vise
        </p>
        <br />
        <p>
          Det her er ikke perfekte sider,<br /><br />
          bare ideer eller øvelser!
        </p>
      </div>

      <div
        class="flex items-center justify-center gap-3 px-8 py-4 max-[500px]:flex-wrap max-[500px]:justify-center max-[500px]:px-4"
      >
        <label for="projectSort">Sortér projekter:</label>
        <select
          id="projectSort"
          class="font-code text-text-color bg-main-bg border-text-color max-w-full rounded-[7px] border p-2"
        >
          <option value="oldest">Tidligst til senest</option>
          <option value="newest">Senest til tidligst</option>
        </select>
      </div>
      <section id="hobbyProjects" aria-label="Hobbyprojekter"></section>
    </main>
  </body>
</html>
